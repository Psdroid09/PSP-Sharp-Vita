name: Build PSPSharp diagnostic probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/diagnostic/**"
      - "src/common/**"
      - "tests/**"
      - ".github/workflows/build-diagnostic.yml"
  pull_request:
    paths:
      - "src/diagnostic/**"
      - ".github/workflows/build-diagnostic.yml"

permissions:
  contents: read

concurrency:
  group: psp-sharp-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile host-only category classifier tests
        run: cc -std=c11 -Wall -Wextra -Werror -pedantic -Isrc/common tests/psp_scope_test.c -o psp_scope_test
      - name: Verify PSP-only fail-closed policy
        run: ./psp_scope_test
      - name: Compile bounded PBP/SFO parser tests
        run: cc -std=c11 -Wall -Wextra -Werror -pedantic -Isrc/common tests/pbp_scope_test.c -o pbp_scope_test
      - name: Verify PSP-vs-PS1 on PBP-shaped test vectors
        run: ./pbp_scope_test
      - name: Compile standalone RGBA scaler tests
        run: cc -std=c11 -Wall -Wextra -Werror -pedantic -Isrc/common tests/sharp_scale_test.c -o sharp_scale_test
      - name: Verify crisp scaling and bounds
        run: ./sharp_scale_test

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: vitasdk/vitasdk:2026.08
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install taiHEN development package
        run: vdpm install taihen

      - name: Configure
        run: |
          cmake -S src/diagnostic -B build/diagnostic \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/diagnostic --parallel 2

      - name: Verify output
        run: |
          test -s build/diagnostic/PSPSharpProbe.suprx
          file build/diagnostic/PSPSharpProbe.suprx
          ls -lh build/diagnostic/PSPSharpProbe.suprx

      - name: Upload diagnostic plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: PSPSharpProbe-suprx
          path: build/diagnostic/PSPSharpProbe.suprx
          if-no-files-found: error
          retention-days: 7
